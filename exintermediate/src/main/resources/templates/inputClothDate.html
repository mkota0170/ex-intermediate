<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            width: 350px;
        }
        th,td{
            border: 1px solid;
            padding: 8px;
        }
        th{
            width: 100px;
        }
        td{
            width: 250px;
        }
    </style>
</head>
<body>
    <h1>衣類検索</h1>
    <form th:action="@{/ex03/searchCloth}" method="post">
        <input type="radio" name="gender" value="0">men
        <input type="radio" name="gender" value="1">women
        <select name="color">
            <option value="赤">赤</option>
            <option value="青">青</option>
            <option value="白">白</option>
            <option value="黄">黄</option>
        </select><br>
        <button>検索</button>
    </form>
    <br>
    <table class="table">
    <tr th:each="cloth : ${clothList}">
        <td>
            <table>
                <tr>
                    <th>ジャンル</th>
                    <td th:text="${cloth.genre}"></td>
                </tr>
                <tr>
                    <th>サイズ</th>
                    <td th:text="${cloth.size}"></td>
                </tr>
                <tr>
                    <th>価格</th>
                    <td th:text="${cloth.price}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
