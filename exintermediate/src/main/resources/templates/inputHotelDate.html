<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            width: 350px;
        }
        th,td{
            border: 1px solid;
            padding: 8px;
        }
        th{
            width: 100px;
        }
        td{
            width: 250px;
        }
    </style>
</head>
<body>
    <h1>ホテル検索</h1>
    <form action="searchResult.html" th:action="@{/ex02/searchHotel}" method="post">
        <input type="text" name="price">円以下<br>
        <button>検索</button>
    </form>
    <br>
    <table class="table">
    <tr th:each="hotel : ${hotelList}">
        <td>
            <table>
                <tr>
                    <th>ホテル名</th>
                    <td th:text="${hotel.hotelName}"></td>
                </tr>
                <tr>
                    <th>最寄り駅</th>
                    <td th:text="${hotel.nearestStation}"></td>
                </tr>
                <tr>
                    <th>価格</th>
                    <td th:text="${hotel.price}"></td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
